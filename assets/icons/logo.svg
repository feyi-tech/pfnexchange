<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bf953f;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#fcf6ba;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b38728;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#fbf5b7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa771c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(512, 550) scale(1.1)">
    <!-- L -->
    <text x="-280" y="100" font-family="'Cinzel Decorative', serif" font-size="500" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" filter="url(#glow)">L</text>
    <!-- C -->
    <text x="120" y="100" font-family="'Cinzel Decorative', serif" font-size="500" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" filter="url(#glow)">C</text>
    <!-- Regal Crown on C -->
    <path d="M20,-380 L40,-460 L60,-410 L90,-480 L120,-420 L150,-480 L180,-410 L200,-460 L220,-380 Z" fill="url(#goldGradient)" filter="url(#glow)" />
    <path d="M20,-370 L220,-370 L220,-350 L20,-350 Z" fill="url(#goldGradient)" />
  </g>
</svg>
